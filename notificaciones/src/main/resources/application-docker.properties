spring.application.name=notificaciones

# Cambia el puerto según corresponda
server.port=8086

# Configuración de Base de Datos (Ajustada para Docker)
spring.datasource.url=jdbc:mysql://mysql:3306/db_notificaciones?useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=rootpass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Configuración de Eureka (Ajustada para la red de Docker)
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=nombre-del-servicio
eureka.instance.instance-id=${spring.application.name}:${server.port}
