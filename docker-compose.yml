services:

  # ----------------------------------------------------------
  # Base de Datos: MySQL
  # ----------------------------------------------------------
  mysql:
    image: mysql:8.4
    container_name: mysql-bibliogo
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: bibliogo_usuarios
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - bibliogo-net

  # ----------------------------------------------------------
  # Servidor de Descubrimiento: Eureka Server
  # ----------------------------------------------------------
  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: eureka-server
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8761:8761"
    # Cambiamos a CMD-SHELL para intentar con curl o wget de forma más flexible, 
    # o simplemente usando una petición básica al endpoint de salud
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8761/actuator/health || wget --no-verbose --tries=1 --spider http://localhost:8761/actuator/health || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 25s
    restart: on-failure
    networks:
      - bibliogo-net
  # ----------------------------------------------------------
  # Enrutador Central: API Gateway
  # ----------------------------------------------------------
  api-gateway:
    build:
      context: ./api-gateway
    container_name: api-gateway
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8090:8090"
    depends_on:
      
      eureka-server:
        condition: service_healthy
    restart: on-failure
    networks:
      - bibliogo-net

  # ----------------------------------------------------------
  # 1. UsuariosMicro (Puerto 8081)
  # ----------------------------------------------------------
  usuarios-micro:
    build:
      context: ./UsuariosMicro
    container_name: usuarios-micro
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    restart: on-failure
    networks:
      - bibliogo-net

  # ----------------------------------------------------------
  # 2. Catalogo-Service (Puerto 8082)
