# Redirección interna hacia el contenedor de MySQL en el puerto nativo 3306
# Usamos el nombre de la base de datos que pusiste: db_catalogo
spring.datasource.url=jdbc:mysql://mysql:3306/bibliogo_catalogo?useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=rootpass

# Redirección interna hacia el contenedor de Eureka
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/

# Ajustes de red dinámicos para evitar IPs harcodeadas (127.0.0.1)
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.cloud.client.ip-address}:${spring.application.name}:${server.port}