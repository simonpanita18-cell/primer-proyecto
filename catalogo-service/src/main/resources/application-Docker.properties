# ============================================================
# Configuración - Microservicio de Catálogo
# ============================================================
spring.application.name=catalogo-service
server.port=8082

# Configuración de Base de Datos (Ajustada para Docker)
# Nota: 'mysql' es el nombre del servicio en el docker-compose
spring.datasource.url=jdbc:mysql://mysql:3306/db_catalogo?useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=rootpass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuración de Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=true

# Configuración de Eureka Client (Para que se registre en el servidor)
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=catalogo-service
eureka.instance.instance-id=${spring.application.name}:${server.port}
