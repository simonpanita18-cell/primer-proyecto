spring.application.name=prestamo
server.port=8084

# Configuración de Base de Datos (Docker MySQL)
spring.datasource.url=jdbc:mysql://mysql:3306/db_prestamo?useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=rootpass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html

# Configuración de Eureka (Red de Docker)
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=prestamo-service
eureka.instance.instance-id=${spring.application.name}:${server.port}
