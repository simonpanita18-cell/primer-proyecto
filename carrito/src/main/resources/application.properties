spring.application.name=carrito
server.port=8083

# Apunta al puerto externo mapeado en tu docker-compose (3307)
spring.datasource.url=jdbc:mysql://localhost:3307/bibliogo_carrito?useSSL=false&serverTimezone=America/Santiago
spring.datasource.username=root
spring.datasource.password=rootpass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Registro en Eureka Local
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=localhost:${spring.application.name}:${server.port}