# 1. Apunta al NOMBRE del servicio de base de datos en el compose y puerto interno 3306
spring.datasource.url=jdbc:mysql://mysql:3306/bd_carrito?useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=rootpass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 2. Apunta al NOMBRE del servicio de Eureka en el compose
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/

# 3. Configuraciones dinámicas de red interna de Docker (Sin IPs fijas 127.0.0.1)
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.cloud.client.ip-address}:${spring.application.name}:${server.port}