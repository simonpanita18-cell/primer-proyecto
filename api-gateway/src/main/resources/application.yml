server:
  port: 8090

spring:
  application:
    name: APIGateway-server
  cloud:
    gateway:
      routes:
        - id: ruta-usuarios
          uri: lb://UsuariosMicro
          predicates:
            - Path=/usuarios/**

        - id: ruta-catalogo
          uri: lb://Catalogo-service
          predicates:
            - Path=/libros/**

        - id: ruta-carrito
          uri: lb://Carrito
          predicates:
            - Path=/carrito/**
        
        - id: ruta-prestamo
          uri: lb://prestamo
          predicates:
            - Path=/prestamos/**
        
        - id: ruta-envio
          uri: lb://envio
          predicates:
            - Path=/envios/**
        
        - id: ruta-pago
          uri: lb://pago
          predicates:
            - Path=/pagos/**
        
        - id: ruta-notificaciones
          uri: lb://notificaciones
          predicates:
            - Path=/notificaciones/**
        
        - id: ruta-resena
          uri: lb://resena
          predicates:
            - Path=/resenas/**
        
        - id: ruta-reporte
          uri: lb://reporte
          predicates:
            - Path=/reportes/**

# CONFIGURACIÓN LOCAL 
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/


logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web: INFO

---
# CONFIGURACIÓN PARA DOCKER
spring:
  config:
    activate:
      on-profile: docker

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.cloud.client.ip-address}:${spring.application.name}:${server.port}